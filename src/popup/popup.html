<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      text-align: center;
      margin-bottom: 12px;
      color: #00d4ff;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4444;
    }
    .status-dot.connected { background: #44ff44; }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-start { background: #00c853; color: #fff; }
    #btn-stop { background: #ff1744; color: #fff; }
    .slider-group {
      margin-bottom: 16px;
    }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #00d4ff;
    }
    .stats {
      border-top: 1px solid #333;
      padding-top: 12px;
    }
    .stats h2 {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .stat-value { color: #00d4ff; font-weight: 600; }
  </style>
</head>
<body>
  <h1>TETR.IO Bot</h1>

  <div class="status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">未連線</span>
  </div>

  <div class="controls">
    <button id="btn-start">▶ 開始</button>
    <button id="btn-stop" disabled>⏹ 停止</button>
  </div>

  <div class="slider-group">
    <label>
      <span>操作速度</span>
      <span id="speed-label">Fast</span>
    </label>
    <select id="speed-select" style="width:100%; padding:6px; background:#0f0f1e; color:#e0e0e0; border:1px solid #333; border-radius:6px; font-size:12px;">
      <option value="safe">Safe（30ms，相容性最佳）</option>
      <option value="fast" selected>Fast（16ms，推薦）</option>
    </select>
  </div>

  <div class="slider-group">
    <label>
      <span>AI 強度</span>
      <span id="strength-label">Strong</span>
    </label>
    <select id="strength-select" style="width:100%; padding:6px; background:#0f0f1e; color:#e0e0e0; border:1px solid #333; border-radius:6px; font-size:12px;">
      <option value="fast">Fast（beam 8，最省算力）</option>
      <option value="balanced">Balanced（beam 25）</option>
      <option value="strong" selected>Strong（beam 50，長期最強）</option>
    </select>
  </div>

  <div class="slider-group">
    <label>
      <span>評估策略</span>
      <span id="weights-label">Balanced</span>
    </label>
    <select id="weights-select" style="width:100%; padding:6px; background:#0f0f1e; color:#e0e0e0; border:1px solid #333; border-radius:6px; font-size:12px;">
      <option value="balanced" selected>Balanced（14 特徵，均衡）</option>
      <option value="eltetris">ElTetris（6 特徵，經典研究）</option>
      <option value="aggressive">Aggressive（重懲罰洞，激進）</option>
    </select>
  </div>

  <div class="stats">
    <h2>統計</h2>
    <div class="stat-row">
      <span>已放置方塊</span>
      <span class="stat-value" id="stat-pieces">0</span>
    </div>
    <div class="stat-row">
      <span>PPS</span>
      <span class="stat-value" id="stat-pps">0.0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
